# Read the Docs build configuration — NeoMundi Python SDK.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Minimal on purpose: it builds the MkDocs site described by mkdocs.yml and
# installs nothing from the project itself. The documentation published here is
# prose already committed to docs/; no API is introspected, so the SDK and its
# runtime dependency are not needed to build it.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
