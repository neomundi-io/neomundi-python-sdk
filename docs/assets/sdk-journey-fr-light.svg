<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="220" viewBox="0 0 1080 220" role="img" aria-labelledby="title desc"><title id="title">INSTRUMENTER VOTRE IA EN PYTHON</title><desc id="desc">Intégrer le SDK : tracer, mesurer, examiner, vérifier.</desc><rect width="1080" height="220" rx="14" fill="#ffffff"/><text x="540" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17243d">INSTRUMENTER VOTRE IA EN PYTHON</text><text x="540" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#63748c">Intégrer le SDK : tracer, mesurer, examiner, vérifier.</text><rect x="18" y="78" width="232" height="112" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="18" y="78" width="232" height="6" rx="3" fill="#64748b"/><text x="134" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#64748b">INSTALLER</text><text x="134" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#17243d">pip install neomundi</text><text x="134" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#63748c">client Python</text><path d="M258 134 h20 m-8 -6 l8 6 l-8 6" stroke="#94a3b8" stroke-width="2" fill="none"/><rect x="288" y="78" width="232" height="112" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><rect x="288" y="78" width="232" height="6" rx="3" fill="#2563eb"/><text x="404" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2563eb">TRACER</text><text x="404" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#17243d">Instrumenter l'appel</text><text x="404" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#63748c">soumission facturée</text><path d="M528 134 h20 m-8 -6 l8 6 l-8 6" stroke="#94a3b8" stroke-width="2" fill="none"/><rect x="558" y="78" width="232" height="112" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><rect x="558" y="78" width="232" height="6" rx="3" fill="#0f766e"/><text x="674" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f766e">MESURER</text><text x="674" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#17243d">Consulter les mesures</text><text x="674" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#63748c">signaux + couverture</text><path d="M798 134 h20 m-8 -6 l8 6 l-8 6" stroke="#94a3b8" stroke-width="2" fill="none"/><rect x="828" y="78" width="232" height="112" rx="10" fill="#f8fafc" stroke="#d19c32" stroke-width="2"/><rect x="828" y="78" width="232" height="6" rx="3" fill="#d19c32"/><text x="944" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#d19c32">VÉRIFIER</text><text x="944" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#17243d">Contrôler la preuve</text><text x="944" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#63748c">pas de vérité garantie</text></svg>