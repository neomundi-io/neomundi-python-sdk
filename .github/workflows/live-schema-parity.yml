name: Deployed wire contract parity (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-schema-parity.yml'
      - 'scripts/check_live_wire_schemas.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-live-wire-schemas:
    name: Compare production REST and SSE public schemas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only public contract comparison (no auth, no credits)
        run: python scripts/check_live_wire_schemas.py
